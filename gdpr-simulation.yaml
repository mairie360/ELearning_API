# GDPR usage simulation (MAIR-497), played by mairie360/CICD tests/gdpr/simulation on the test
# stack only (docker-compose-gdpr-simulation.yml, gdpr_simulation_test.sh).
#
# Fictitious personas with unique values go through the marker journey of MAIR-290: their values
# are sent in query strings and in bodies of the wrong type (deliberate errors), next to an
# enrolment round trip. The logs of every container, the Redis keys, the database after the purge
# and a sample of its free-text columns are then checked and reviewed (CICD analyze.mjs).
version: 1
journey: gdpr-marker.yaml
personas: 4
# ELearning_API stores no free text from the agents and no persona value reaches its tables (the
# enrolment names a seeded agent and formation): there is nothing of a persona to erase.
erased: 0
