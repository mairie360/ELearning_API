volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3006 #change port
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_HOST: postgres
  DB_PASSWORD: password
  DB_PORT: 5432
  # -- Scaleway Object Storage (S3) : placeholders dev, vraies valeurs en secrets CI --
  S3_BUCKET: mairie360-elearning
  S3_REGION: fr-par
  S3_ENDPOINT: https://s3.fr-par.scw.cloud
  S3_ACCESS_KEY: ""   # TODO: renseigner (secret CI + local)
  S3_SECRET_KEY: ""   # TODO: renseigner (secret CI + local)
  S3_PRESIGN_TTL_SECS: 900

x-depends-on: &depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:3006"] #change port
  interval: 10s
  timeout: 5s
  retries: 5

x-service: &service-template
  image: ghcr.io/mairie360/service_name:latest
  pull_policy: always
  restart: always
  expose:
    - "3006"
  networks:
    - backend
  healthcheck:
    <<: *healthcheck

services:
  postgres:
    image: ghcr.io/mairie360/database:dev-fb7c223
    restart: always
    container_name: mairie360-db-elearning-api
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-fb7c223
    container_name: mairie360-liquibase-elearning-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 refuses to seed the admin (users.id = 1) without credentials: this
    # throwaway stack uses the public template admin. Never pass the flag on a real instance.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-elearning-api #change api name
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seeder:
    image: postgres:18-alpine
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    # ON_ERROR_STOP: a failing fixture must fail the stack, not leave ZAP scanning without users.
    command: >
      psql -h postgres -U postgres -d mairie_360_database -v ON_ERROR_STOP=1 -f /init-test.sql
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    networks:
      - backend

  elearning: # change api name
    container_name: elearning_api-developpement # change api name
    # The API under test: the published ghcr.io/mairie360/elearning-api:dev-<sha> image in CI, or
    # elearning-api:local built by the *_test.sh script from development.Dockerfile. No build: block,
    # so CI tests the artifact that gets promoted instead of recompiling the sources.
    image: ${IMAGE_REF:?IMAGE_REF must name the API image under test, run the matching *_test.sh script}
    ports:
      - "3006:3006" #change port
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://elearning.development.mairie360.fr
      JWT_SECRET: b"secret"
      # Public test value, known to every reader of this repo: mairie360_api_lib refuses to start
      # with it unless JWT_ALLOW_WEAK_SECRET is set. Dev/test stacks only, never a deployment, where
      # JWT_SECRET is a random value of at least 32 bytes, distinct per instance (MAIR-428).
      JWT_ALLOW_WEAK_SECRET: "true"
      JWT_TIMEOUT: 3600
      # Serves Swagger UI and /api-docs/openapi.json (off in production, MAIR-424).
      SWAGGER_ENABLED: "true"
      # The scan hammers the API as a single user: lift the per-user rate limit (MAIR-425).
      RATE_LIMIT_PER_SECOND: 100000
      RATE_LIMIT_BURST: 100000
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The published image is distroless (no shell, no curl), so the API cannot carry its own
  # healthcheck: this sidecar polls /ready and the services that need the API wait for it to
  # complete instead.
  elearning-ready:
    image: curlimages/curl:latest
    depends_on:
      elearning:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://elearning:3006/ready >/dev/null; do
      echo "waiting for elearning..."; sleep 2; done; echo "elearning ready"'
    networks:
      - backend

  security-scan:
    image: zaproxy/zap-stable
    networks:
      - backend
    depends_on:
      elearning-ready:
        condition: service_completed_successfully
      seeder:
        condition: service_completed_successfully
    volumes:
      - ./.zap/rules.tsv:/zap/wrk/rules.tsv:ro
      - ./.zap/scan.sh:/zap/wrk/scan.sh:ro
      # OpenAPI coverage gate (MAIR-194), from the CICD checkout (see security_test.sh).
      - ./cicd-repo/tests/zap/zap_hooks.py:/zap/wrk/zap_hooks.py:ro
    # -t: the spec the API serves itself (utoipa), so ZAP imports every operation.
    # -O: the spec's `servers` (localhost:3006, development.mairie360.fr) are unreachable from
    #   this container; send every imported request to the `elearning` service instead.
    # -c rules.tsv: informational alerts are set to IGNORE; any other alert (WARN/FAIL) makes
    #   zap-api-scan.py exit != 0, which fails the job (no -I).
    # .zap/scan.sh: signs a 2-hour admin JWT (sub=1, the Admin seeded by liquibase) with
    #   JWT_SECRET, then runs zap-api-scan.py with the arguments below plus a replacer that injects
    #   it on every request, so the authenticated routes are scanned instead of answering 401. No
    #   token is committed (MAIR-428).
    # --hook zap_hooks.py: OpenAPI coverage gate (mairie360/CICD tests/zap). After the scan it maps
    #   every request ZAP sent to an operation of the spec and exits 1 when an operation was never
    #   reached, or when an operation that requires `jwt` only got 401/403.
    environment:
      # Must equal the JWT_SECRET of the elearning service.
      JWT_SECRET: b"secret"
    command:
      - bash
      - /zap/wrk/scan.sh
      - -t
      - http://elearning:3006/api-docs/openapi.json
      - -f
      - openapi
      - -O
      - http://elearning:3006
      - -c
      - rules.tsv
      - --hook
      - /zap/wrk/zap_hooks.py
